[project]
name = "reeldock"
version = "0.1.0.dev1"
description = "ReelDock 影坞 — persistent NAS media workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2",
  "cryptography>=44,<48",
  "pwdlib[argon2]>=0.2,<1",
  "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/reeldock"]
artifacts = ["backend/src/reeldock/migrations/**"]

[project.scripts]
reeldock = "reeldock.cli:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/src/reeldock/app.py" = ["B008"]
