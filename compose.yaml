name: reeldock
services:
  reeldock:
    image: ${REELDOCK_IMAGE:-reeldock:0.1.0-local}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    user: "${REELDOCK_UID:-10001}:${REELDOCK_GID:-10001}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${REELDOCK_BIND_IP:-127.0.0.1}:${REELDOCK_PORT:-8765}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REELDOCK_DATA_DIR: /data
      REELDOCK_CACHE_DIR: /cache
      REELDOCK_ALLOWED_ORIGINS: '${REELDOCK_ALLOWED_ORIGINS:-["http://localhost:8765","http://127.0.0.1:8765"]}'
      REELDOCK_SECURE_COOKIE: ${REELDOCK_SECURE_COOKIE:-false}
      REELDOCK_WORKER_ENABLED: ${REELDOCK_WORKER_ENABLED:-true}
      REELDOCK_WORKER_CONCURRENCY: ${REELDOCK_WORKER_CONCURRENCY:-2}
    volumes:
      - type: bind
        source: ${REELDOCK_DATA_PATH:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${REELDOCK_CACHE_PATH:-./cache}
        target: /cache
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    pids_limit: 128
    mem_limit: 1g
    stop_grace_period: 60s
    restart: unless-stopped
