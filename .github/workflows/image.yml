name: Production image validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: reeldock:0.1.0-local
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.10'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: docker compose --env-file .env.example config --quiet
      - run: uv run python scripts/p5_container_smoke.py --output reports/p5-container.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-image-validation
          path: reports/p5-container.json
